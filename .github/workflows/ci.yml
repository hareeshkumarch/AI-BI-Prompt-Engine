name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify the OpenAPI client is in sync
        run: |
          pnpm run codegen
          if ! git diff --quiet -- lib/api-client-react lib/api-zod; then
            echo "::error::Generated API client is out of date. Run 'pnpm run codegen' and commit the result."
            git --no-pager diff --stat -- lib/api-client-react lib/api-zod
            exit 1
          fi
