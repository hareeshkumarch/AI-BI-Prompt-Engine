kind = "web"
previewPath = "/"
title = "AI BI Studio"
description = "An advanced AI-native business intelligence workspace that connects to relational data, turns natural-language questions into safe SQL, and explains results with production-ready visualizations."
version = "1.0.0"
id = "artifacts/ai-bi-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18336

[services.development]
run = "pnpm --filter @workspace/ai-bi-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-bi-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-bi-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18336"
BASE_PATH = "/"
