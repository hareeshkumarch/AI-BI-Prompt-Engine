<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>AI BI Studio</title>
    <meta name="description" content="AI BI Studio — An AI-native business intelligence workspace that turns plain-English questions into inspectable, safe SQL analyses and declarative visualizations." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="AI BI Studio" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // Applied before first paint so a dark session never flashes light.
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored === 'dark' || ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (error) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
